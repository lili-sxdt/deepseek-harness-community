name: 版本列表更新（开 PR 待审核）

# 每天检测 DeepSeek-Harness 上游新版本 → 把新版本及其官方更新说明追加到版本列表 → 开 PR 待审核。
# 需仓库 Settings -> Actions -> General 里勾选 "Allow GitHub Actions to create and approve pull requests"。

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-track
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests

      - name: 检测上游新版本
        run: python scripts/check_upstream.py --apply

      - name: 开 PR（仅当有变更时）
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "🤖 检测到 DeepSeek-Harness 新版本，请审阅后合并"
          branch: version-list/upstream
          commit-message: "docs(version-status): 自动追加新版本及官方更新说明"
          delete-branch: true
          body: |
            ## 自动更新 · 审阅后合并

            本 PR 由 `scripts/check_upstream.py` 自动生成，内容来自上游[官方 Releases](https://github.com/deepseek-ai/deepseek-harness/releases)。

            **请在合并前：**
            - [ ] 核对版本号与日期
            - [ ] 确认官方更新说明无误
            - [ ] 确认后合并（合并即上线）
            确认无误后合并，合并即上线。
