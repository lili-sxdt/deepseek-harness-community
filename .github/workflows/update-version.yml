name: 版本列表自动更新

# 每天检测 DeepSeek-Harness 上游新版本 + npm，直接更新版本列表并自动发布。
# 说明：GITHUB_TOKEN 提交到 main 不会触发 deploy-pages（防递归），所以本工作流在提交推送后
#      显式 dispatch 触发展开工作流重新发布（deploy-pages 需含 workflow_dispatch）。
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write          # 用于触发 deploy-pages 重新发布

concurrency:
  group: version-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests

      - name: 检测上游新版本并更新版本表
        run: python scripts/check_upstream.py --apply

      - name: 提交并推送 + 触发重新发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add docs/version-status.md state/last_seen.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(version-status): 自动更新版本列表"
            git push
            echo "已更新并推送，触发重新发布…"
            gh workflow run deploy-pages.yml --ref main
          else
            echo "无新版本，跳过。"
          fi
