name: 自动检测更新（开 PR 待审核）

# 每天 09:00 UTC 检测 DSH 官方新版本；检测到新版本就生成纯事实草稿并开一个 PR。
# 人工审阅（补"值得关注点"）→ 合并 → 触发发布工作流上线。若不合并则关闭 PR，下次再检测。

on:
  schedule:
    - cron: "0 9 * * *"      # 每天一次
  workflow_dispatch:          # 也支持手动触发（Actions 页点 Run workflow）

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dsh-update
  cancel-in-progress: false

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests

      - name: 运行更新检测（写入草稿 + 更新状态）
        run: python scripts/check_dsh_updates.py --apply

      - name: 开 PR（仅当有变更时）
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "🤖 检测到 DSH 新版本，请审阅后合并"
          branch: dsh-update/changelog
          commit-message: "docs(changelog): 自动追加 DSH 新版本事实草稿"
          delete-branch-on-merge: true
          body: |
            ## 自动更新 · 审阅后合并

            本 PR 由 `scripts/check_dsh_updates.py` 自动生成，含「纯事实」草稿（版本 / 日期 / 官方说明）。

            **请在合并前：**
            - [ ] 核对版本号 / 日期 / 官方说明是否正确
            - [ ] 补充「值得关注点」一列（第三方视角，需人工判断）
            - [ ] 确认无误后合并（合并后自动构建并上线）
