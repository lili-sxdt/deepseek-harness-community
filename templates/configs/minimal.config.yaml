# 最小可运行配置模板
# 适用场景：一次模型调用 + 一次简单评测
# 修改要点：改 provider / base_url / model / dataset / metric
# 测过版本：0.1.2-alpha（以官方为准）

model:
  provider: openai_compatible   # deepseek / openai_compatible / ollama / vllm / qwen / claude
  base_url: http://127.0.0.1:8000/v1
  api_key: ${API_KEY}           # 用环境变量注入，绝不写死
  model: your-model-name

eval:
  dataset: ./datasets/sample.jsonl
  metric: text_match

storage:
  backend: json
  out_dir: ./results
  log_level: info
  telemetry: false              # 关遥测（隐私）
