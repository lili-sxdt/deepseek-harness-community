# Docker Compose 一键部署模板
# 适用场景：本地/单机快速启动，或服务器容器化运行
# 修改要点：端口、挂载目录、模型端点、环境变量
# 测过版本：0.1.2-alpha（以官方为准）
services:
  harness:
    image: <your-harness-image>        # 替换成你的 harness 镜像
    container_name: deepseek-harness
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY}             # 环境变量注入，别写死
      - MODEL_ENDPOINT=http://host.docker.internal:11434
    volumes:
      - ./configs:/app/configs         # 挂载配置
      - ./results:/app/results         # 结果输出
      - ./datasets:/app/datasets       # 数据集
    restart: unless-stopped
